e input{width:165px;margin-left:auto}.bottom .toolbar{display:grid;grid-template-columns:1fr;width:100%}.numbers{gap:9px}.number{padding:13px}.number strong{font-size:25px}.number span{font-size:12px}.dialogactions button{flex:1}.recordfoot{align-items:stretch}.recordfoot button{font-size:12px}.footer{padding:20px 3px}.navindex{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"topbar\">\u003cdiv class=\"shell topinner\">\u003cdiv class=\"brand\">\u003cdiv class=\"shield\" aria-hidden=\"true\">I\u003c/div>\u003cdiv>\u003cdiv class=\"brandtitle\">SUCID\u003c/div>\u003cdiv class=\"brandsub\">JEFATURA DISTRITAL · PARTE DE NOVEDADES\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"topright\">\u003cspan class=\"badge\">PILOTO PRIVADO · 0.3\u003c/span>\u003cspan class=\"operator\" title=\"Cuenta propietaria\">PO\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cmain class=\"shell\">\u003cdiv class=\"hero\">\u003cdiv>\u003cdiv class=\"eyebrow\">Programación operativa / UOP\u003c/div>\u003ch1>Tu dependencia, al día.\u003c/h1>\u003cp class=\"muted\">Personal, horarios y recursos en un mismo parte.\u003c/p>\u003c/div>\u003cdiv class=\"dateplate\" id=\"dateLabel\">Consultando fecha del parte…\u003c/div>\u003c/div>\n\u003cdiv class=\"test\" id=\"testBanner\">\u003cspan aria-hidden=\"true\">◈\u003c/span>\u003cdiv>\u003cstrong>Entorno de prueba.\u003c/strong> Datos completamente ficticios. Esta vista no usa Google ni guarda información fuera de esta página.\u003c/div>\u003c/div>\n\u003cdiv class=\"overview\" aria-label=\"Resumen de la programación\">\u003cdiv class=\"stat\">\u003cspan class=\"statname\">Efectivos programados\u003c/span>\u003cstrong id=\"statPeople\">—\u003c/strong>\u003cspan class=\"small\">Vinculados a la nómina\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"statname\">Horarios de servicio\u003c/span>\u003cstrong id=\"statShifts\">—\u003c/strong>\u003cspan class=\"small\">Varios tramos por efectivo\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"statname\">Personal de recargo\u003c/span>\u003cstrong id=\"statRecargo\">—\u003c/strong>\u003cspan class=\"small\">Se informa por separado\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan class=\"statname\">Móviles en servicio\u003c/span>\u003cstrong id=\"statVehicles\">—\u003c/strong>\u003cspan class=\"small\">Disponibilidad declarada\u003c/span>\u003c/div>\u003c/div>\n\u003csection class=\"part\">\u003cdiv class=\"parttop\">\u003cdiv>\u003cspan id=\"partBadge\" class=\"badge\">Cargando…\u003c/span>\u003cp id=\"partReason\" class=\"help\">Consultando el último parte.\u003c/p>\u003cp id=\"partDates\" class=\"small muted\">\u003c/p>\u003cp id=\"identityWarning\" class=\"pending-note\" hidden>\u003c/p>\u003c/div>\u003cdiv class=\"toolbar\">\u003cbutton id=\"request\" disabled>Solicitar actualización\u003c/button>\u003cbutton id=\"present\" class=\"primary\" disabled>Presentar parte ↗\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"partbottom\">\u003cdiv class=\"reviewprogress\">\u003cspan id=\"progress\" class=\"small\">—\u003c/span>\u003cdiv class=\"progress-track\" aria-hidden=\"true\">\u003cdiv id=\"progressFill\" class=\"progress-fill\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"toolbar\">\u003ca id=\"copy\" target=\"_blank\" rel=\"noopener\" hidden>Abrir copia ↗\u003c/a>\u003cbutton id=\"reload\" disabled>↻ Recargar\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv id=\"status\" class=\"status\" role=\"status\" aria-live=\"polite\">Conectando con la copia de prueba…\u003c/div>\u003cdiv class=\"mobilemenu\">\u003clabel for=\"mobileNav\">¿Qué información querés actualizar?\u003c/label>\u003cselect id=\"mobileNav\" disabled>\u003c/select>\u003c/div>\n\u003cdiv class=\"layout\">\u003cnav id=\"nav\" class=\"side\" aria-label=\"Segmentos del parte\">\u003c/nav>\u003csection id=\"content\" class=\"content\" aria-label=\"Formulario del segmento\">\u003c/section>\u003c/div>\n\u003cp class=\"footer\">SUCID · Sistema Único de Carga de Información Distrital. La programación no certifica presencia efectiva. Al vencer el parte se conserva la información y se requiere una nueva revisión. Piloto de acceso exclusivo a la cuenta propietaria. Los resultados históricos siguen siendo opcionales; todavía no hay integración con SIID.\u003c/p>\n\u003c/main>\n\u003cdialog id=\"picker\">\u003cdiv class=\"eyebrow\">Nómina de la dependencia\u003c/div>\u003ch2>Seleccionar personal\u003c/h2>\u003cp class=\"help\">Seleccioná cada efectivo una sola vez. Dentro de su tarjeta podés agregar más horarios.\u003c/p>\u003cinput id=\"pickSearch\" type=\"search\" placeholder=\"Buscar apellido, jerarquía o DNI\" aria-label=\"Buscar personal\">\u003cdiv id=\"choices\" class=\"choices\">\u003c/div>\u003cdiv class=\"dialogactions\">\u003cbutton id=\"pickCancel\">Volver\u003c/button>\u003cbutton id=\"pickAdd\" class=\"primary\">Agregar seleccionados\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"presentDialog\">\u003cdiv class=\"eyebrow\">Confirmación del operador\u003c/div>\u003ch2>Presentar parte actualizado\u003c/h2>\u003cp class=\"help\">La presentación confirma la revisión de los segmentos obligatorios. Los datos se conservan cuando vence la vigencia.\u003c/p>\u003cdiv id=\"presentSummary\">\u003c/div>\u003clabel for=\"hours\">Vigencia desde esta confirmación\u003c/label>\u003cselect id=\"hours\">\u003coption value=\"24\">24 horas\u003c/option>\u003coption value=\"12\">12 horas\u003c/option>\u003c/select>\u003clabel class=\"reviewcheck\" style=\"margin-top:18px\">\u003cinput id=\"presentCheck\" type=\"checkbox\">\u003cspan>Confirmo que el parte representa la información revisada de la dependencia.\u003c/span>\u003c/label>\u003cdiv class=\"dialogactions\">\u003cbutton id=\"presentCancel\">Volver\u003c/button>\u003cbutton id=\"presentSave\" class=\"primary\" disabled>Confirmar presentación\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"requestDialog\">\u003cdiv class=\"eyebrow\">Revisión extraordinaria\u003c/div>\u003ch2>Solicitar actualización\u003c/h2>\u003cp class=\"help\">Simula una directiva superior. Se conservarán los datos y será necesario revisar nuevamente los segmentos.\u003c/p>\u003clabel for=\"reason\">Motivo\u003c/label>\u003ctextarea id=\"reason\" maxlength=\"500\" placeholder=\"Ej.: actualización extraordinaria del servicio\">\u003c/textarea>\u003cdiv class=\"dialogactions\">\u003cbutton id=\"requestCancel\">Volver\u003c/button>\u003cbutton id=\"requestSave\" class=\"primary\">Solicitar\u003c/button>\u003c/div>\u003c/dialog>\n\u003cdialog id=\"mergeDialog\">\u003cdiv class=\"eyebrow\">Varios horarios, un efectivo\u003c/div>\u003ch2>Unir con otra tarjeta\u003c/h2>\u003cp class=\"help\">Los horarios de esta tarjeta se agregarán al efectivo elegido. La tarjeta de origen se retirará del borrador. Se aplicará únicamente al guardar.\u003c/p>\u003clabel for=\"mergeTarget\">Efectivo de destino en este segmento\u003c/label>\u003cselect id=\"mergeTarget\">\u003c/select>\u003cdiv class=\"dialogactions\">\u003cbutton id=\"mergeCancel\">Volver\u003c/button>\u003cbutton id=\"mergeSave\" class=\"primary\">Unir horarios\u003c/button>\u003c/div>\u003c/dialog>\n\u003cscript>\n/** Catálogo del piloto UOP 0.3. Columnas de origen verificadas; ningún rango viene del navegador. */\nfunction uopSegmentos_() {\n  const campo = function(key,label,col,type,required,extra) { return Object.assign({key:key,label:label,col:col,type:type||'text',required:!!required},extra||{}); };\n  const persona = [campo('persona','Efectivo',null,'person',true)];\n  const servicio = function(id,label,start,count) { return {id:id,label:label,category:'Servicio diario',sheet:'Recurso',start:start,count:count,person:true,multiHorarios:true,stamp:14,\n    header:{cell:({titulares:'B5',superiores:'B11',guardia:'B17',recargos:'B71'})[id],text:({titulares:'Titular y 2° Jefe',superiores:'Superior de Turno',guardia:'Personal de Guardia',recargos:'Depen.'})[id]},\n    fields:persona.concat([campo('funcion','Función',5,'select',true,{catalog:'E18'}),campo('ingreso','Ingreso',6,'time',true),campo('egreso','Egreso',7,'time',true)]),\n    help:'Seleccioná una vez a cada efectivo y agregá hasta cuatro horarios. Egreso anterior al ingreso cruza medianoche; horas iguales indican 24 h. Los recargos se informan por separado.'}; };\n  return [\n    servicio('titulares','Titular y segundo jefe',6,5),\n    servicio('superiores','Superior de turno y conducción',12,5),\n    servicio('guardia','Personal de guardia',18,50),\n    servicio('recargos','Personal de recargo',72,30),\n    {id:'licencias',label:'Licencias y franquicias',category:'Situación del personal',sheet:'Recurso',start:106,count:25,person:true,header:{cell:'E105',text:'Tipo de Licencia'},fields:persona.concat([\n      campo('tipo','Tipo de licencia',5,'select',true,{catalog:'E106'}),campo('inicio','Fecha de inicio',6,'date',true),campo('fin','Fecha de finalización',7,'date',true)]),help:'Se conservan las licencias anteriores hasta que el operador las modifique o retire. No equivalen a ausencias exclusivas.'},\n    {id:'enfermos',label:'Partes de enfermo',category:'Situación del personal',sheet:'Recurso',start:135,count:20,person:true,header:{cell:'E134',text:'Lic. Trat. Salud'},fields:persona.concat([\n      campo('tipo','Tipo de parte',5,'select',true,{catalog:'E135'}),campo('diagnostico','Diagnóstico informado',6,'textarea'),campo('medico','Profesional y matrícula',7),campo('inicio','Fecha de inicio',8,'date',true),campo('fin','Finalización / turno pendiente',9,'date')]),help:'Dejar finalización vacía si aún no está determinada. Acceso del piloto limitado a la cuenta propietaria.'},\n    {id:'sanciones',label:'Sancionados',category:'Situación del personal',sheet:'Recurso',start:159,count:5,person:true,header:{cell:'E158',text:'Sancion'},fields:persona.concat([\n      campo('sancion','Sanción informada',5,'text',true),campo('inicio','Fecha de inicio',6,'date',true),campo('fin','Fecha de finalización',7,'date',true)]),help:'Se transcribe lo informado; la aplicación no determina responsabilidades ni aplica sanciones.'},\n    {id:'numerico',label:'Potencial numérico',category:'Situación del personal',sheet:'Recurso',start:168,count:1,computed:true,fields:[],header:{cell:'C167',text:'Servicio Efectivo'},help:'Resumen calculado. La diferencia entre nómina y servicio no acredita franco efectivo. Choferes y situaciones pueden superponerse.'},\n    {id:'ternas',label:'Ternas · jefes de turno',category:'Conducción y habilitaciones',sheet:'Recurso',start:173,count:14,person:true,stamp:14,header:{cell:'E172',text:'Celular'},fields:persona.concat([\n      campo('celular','Celular',5),campo('observaciones','Observaciones',6,'textarea'),campo('presente','Declarado de turno',7,'checkbox')]),help:'Marcar únicamente a quienes se declaran de turno. Sin marca: no declarado de turno; no se certifica una situación administrativa de franco.'},\n    {id:'choferes',label:'Choferes habilitados',category:'Conducción y habilitaciones',sheet:'Recurso',start:191,count:29,person:true,header:{cell:'F190',text:'Fecha Vto. Lic.'},fields:persona.concat([\n      campo('dni','DNI informado',5,'text',true),campo('vence','Vencimiento de licencia',6,'date',true),campo('observaciones','Observaciones',8,'textarea')]),help:'Se informa el vencimiento de la habilitación. Estar registrado como chofer no acredita disponibilidad de turno.'},\n    {id:'nomina',label:'Nómina y legajo',category:'Dotación y logística',sheet:'Potencial',start:3,count:98,header:{cell:'B2',text:'Jerarquia'},fields:[\n      campo('jerarquia','Jerarquía',2,'text',true),campo('nombre','Apellido y nombre',3,'text',true),campo('funcion','Función habitual',4),campo('chofer','Es chofer',5),campo('dni','DNI',6,'text',true),\n      campo('domicilio','Domicilio',7),campo('departamento','Departamento',8),campo('telefono','Teléfono',9),campo('anterior','Destino anterior',10),campo('comision','En comisión',11),campo('licencias','Licencias adeudadas',12),\n      campo('arma','Arma · número y marca',13),campo('armaVigencia','Vigencia informada del arma',14),campo('chaleco','Chaleco · número',15),campo('chalecoVigencia','Vigencia informada del chaleco',16),\n      campo('oficial','Correo oficial',17,'email'),campo('gmail','Correo alternativo',18,'email'),campo('sat','Habilitación SAT',19),campo('sucid','Operador SUCID',20),campo('se','Servicio extraordinario',21),campo('observaciones','Observaciones',22,'textarea')],\n      help:'No se eliminan repeticiones automáticamente. Las modificaciones de nómina no sustituyen los nombres ya declarados en otros segmentos.'},\n    {id:'moviles',label:'Movilidades del día',category:'Dotación y logística',sheet:'Moviles_Combustible',start:38,count:25,stamp:16,header:{cell:'B37',text:'Movil'},fields:[\n      campo('numero','Número de móvil',2,'text',true),campo('estado','Situación operativa',3,'select',true,{catalog:'C38'}),campo('observaciones','Motivo / observaciones',4,'textarea')],help:'Registrar el motivo de la indisponibilidad. No se carga ni calcula combustible.'},\n    {id:'inventario',label:'Inventario de movilidades',category:'Dotación y logística',sheet:'Moviles_Combustible',start:38,count:25,header:{cell:'K37',text:'Fecha de asignacion'},fields:[\n      campo('asignacion','Fecha de asignación',11,'date'),campo('modelo','Modelo · auto, moto o bicicleta',12),campo('numero','Número de inventario del móvil',14,'text',true),campo('observaciones','Estado, baja o servicio técnico informado',15,'textarea')],help:'Inventario separado de la disponibilidad diaria. Conservar el número de móvil para relacionar ambos listados; no implica una alta o baja administrativa automática.'},\n    {id:'consignas',label:'Consignas y rondines judiciales',category:'Servicios judiciales',sheet:'Consignas',start:6,count:95,stamp:19,header:{cell:'D5',text:'Modalidad'},fields:[\n      campo('inicio','Fecha de inicio',3,'date',true),campo('modalidad','Modalidad',4,'select',true,{catalog:'D6',fallback:['Consigna','Rondín']}),campo('direccion','Dirección',5,'text',true),\n      campo('latitud','Latitud',6,'decimal'),campo('longitud','Longitud',7,'decimal'),campo('departamento','Departamento',8),campo('persona','Institución o persona',9),campo('oficiante','Autoridad judicial',10),\n      campo('expediente','Expediente',11),campo('caratula','Carátula',12),campo('duracion','Duración / hasta nueva orden',13),campo('efectivos','Efectivos afectados',14,'integer'),campo('tiempo','Tiempo de duración informado',15),campo('observaciones','Observaciones / cierre informado',16,'textarea')],\n      help:'Las coordenadas permiten abrir la ubicación en un mapa. La planilla no dispone de una fecha de cierre estructurada; no se certifica automáticamente vigencia ni finalización.'},\n    {id:'maniobras',label:'Resultados · maniobras operativas',category:'Resultados del esquema actual',sheet:'Resultado',start:7,count:1,fixed:true,stamp:26,header:{cell:'C6',text:'P. Controladas por CEO'},fields:[\n      ['ceo','Personas controladas por CEO',3],['biometrico','Personas controladas por biométrico',4],['ley6722','Aprehensiones Ley 6722',5],['ley23737','Ley 23737',6],['medidas','Con medidas',7],['detenidos','Detenidos por delito',8],['armasFuego','Armas de fuego',9],['armasBlancas','Armas blancas',10],['autos','Controles de autos',11],['motos','Controles de motos',12],['colectivos','Controles de colectivos',13],['taxis','Controles taxi/remís',14],['actas','Actas viales',15],['motosRet','Motos retenidas',16],['autosRet','Autos retenidos',17],['licRet','Licencias retenidas',18],['requisas','Requisas vehiculares',19],['habidos','Vehículos habidos',20]\n    ].map(function(x){return campo(x[0],x[1],x[2],'integer',true);}),help:'Compatibilidad con la hoja Resultado existente. No está conectado a SIID; evitar duplicar reportes entre sistemas. Cero debe ser una declaración explícita.'},\n    {id:'aprehensiones',label:'Resultados · aprehendidos y detenidos',category:'Resultados del esquema actual',sheet:'Resultado',start:12,count:1,fixed:true,stamp:26,header:{cell:'C11',text:'Aprehendidos'},fields:[\n      campo('aprehendidos','Aprehendidos',3,'integer',true),campo('detenidos','Detenidos',4,'integer',true),campo('contravenciones','Contravenciones',5,'integer',true),campo('federal','Delito federal',6,'integer',true)],help:'Segmento histórico solicitado para completar el esquema actual. No importa datos de SIID ni INFO-DET.'},\n    {id:'cupos',label:'Resultados · cupos',category:'Resultados del esquema actual',sheet:'Resultado',start:17,count:1,fixed:true,stamp:26,header:{cell:'C16',text:'Cantidad'},fields:[campo('cantidad','Cantidad informada',3,'integer',true)],help:'Mantiene el campo de cupo por dependencia de la planilla actual.'},\n    {id:'nocturnas',label:'Resultados · maniobras nocturnas',category:'Resultados del esquema actual',sheet:'Resultado',start:22,count:1,fixed:true,stamp:26,header:{cell:'C21',text:'P. Controladas'},fields:[\n      campo('controladas','Personas controladas',3,'integer',true),campo('ley6722','Ley 6722',4,'integer',true),campo('detenidas','Personas detenidas',5,'integer',true),campo('vehiculos','Vehículos controlados',6,'integer',true),campo('retenidos','Vehículos retenidos',7,'integer',true)],help:'No acredita presencia ni disponibilidad actual. Se conserva por compatibilidad con el esquema de SUCID.'}\n  ];\n}\n\nfunction uopValidDate_(v){\n  if(typeof v!=='string'||!/^\\d{4}-\\d{2}-\\d{2}$/.test(v))return false;\n  const dt=new Date(v+'T12:00:00Z');return !isNaN(dt.getTime())&&dt.toISOString().slice(0,10)===v;\n}\n\nfunction uopSerial_(iso){return Date.parse(iso+'Z')/86400000+25569;}\n\nfunction uopValidate_(payload,m,spec,people){\n  if(!payload||payload.version!==m.version)throw new Error('El segmento cambió. Recargar antes de guardar.');\n  if(payload.confirm!==true)throw new Error('Confirmar la revisión de este segmento.');\n  if(spec.computed)throw new Error('El potencial numérico es calculado, no se sobrescribe.');\n  if(!Array.isArray(payload.records)||payload.records.length>spec.count)throw new Error('Capacidad de segmento excedida.');\n  if(spec.multiHorarios){\n    if(payload.clientVersion!=='0.3')throw new Error('Actualizar la interfaz del piloto a la versión 0.3 antes de guardar horarios.');\n    if(!uopValidDate_(payload.fechaServicio))throw new Error('Seleccionar una fecha de servicio válida.');\n    if(m.horariosConflictos.length&&payload.resolveScheduleConflicts!==true)throw new Error('Revisar y confirmar los horarios que cambiaron directamente en la copia.');\n  }\n  const slots=new Set(),personIds=new Set(),out=[];\n  payload.records.forEach(function(r){\n    if(!Number.isInteger(r.slot)||r.slot\u003c0||r.slot>=spec.count||slots.has(r.slot))throw new Error('Fila de destino inválida o repetida.');slots.add(r.slot);\n    const row={slot:r.slot,cells:{}};const v=Object.assign({},r.values||{});\n    if(spec.multiHorarios){row.tramos=uopTramos_(v.tramos);v.ingreso=row.tramos[0].ingreso;v.egreso=row.tramos[0].egreso;}\n    if(spec.person){const p=people.find(function(x){return x.id===v.persona;});if(!p||!p.name||!p.rank)throw new Error('Seleccionar un efectivo identificado de la nómina o revisar su carga previa.');const personaKey=spec.multiHorarios?uopPersonaClave_(p):p.id;if(personIds.has(personaKey))throw new Error('Efectivo repetido dentro del segmento. Agregar otro horario en su misma tarjeta.');personIds.add(personaKey);row.cells[3]=p.rank;row.cells[4]=p.name;}\n    m.fields.forEach(function(f){\n      if(f.type==='person')return;let x=v[f.key];const sf=spec.fields.find(function(z){return z.key===f.key;});\n      const empty=x===undefined||x===null||x==='';\n      if(empty&&f.required)throw new Error('Completar '+f.label+' en registro '+(r.slot+1));\n      if(empty){row.cells[sf.col]='';return;}\n      if(f.type==='checkbox'){if(typeof x!
